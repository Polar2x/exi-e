version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: exi_user
      POSTGRES_PASSWORD: exi_password
      POSTGRES_DB: exi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DATABASE_URL: postgresql://exi_user:exi_password@postgres:5432/exi_db
      REDIS_URL: redis://redis:6379
      API_URL: http://website:3000
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://exi_user:exi_password@postgres:5432/exi_db
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
